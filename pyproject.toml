[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nonoforge"
version = "0.1.0"
description = "Pick what you want to make, press one button, it exists — a project maker for people who do not write code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["no-code", "project-generator", "templates", "local-first", "offline", "beginners", "drag-and-drop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
nonoforge = "nonoforge.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nonoforge"

[tool.setuptools]
packages = ["nonoforge"]
include-package-data = true

[tool.setuptools.package-data]
nonoforge = ["web/*", "runtime/*", "recipes/*/*", "recipes/*/files/**/*"]
